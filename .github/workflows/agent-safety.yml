name: Agent Safety Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify no broken imports
        run: |
          # Check for broken imports by running a quick test
          pnpm exec tsc --noEmit || exit 1

      - name: Safety check summary
        run: |
          echo "✅ All safety checks passed"
          echo "Repository is in a good state"
