name: Deploy with Rollback

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI Pipeline", "Code Quality", "Convex Deploy"]
    types: [completed]

jobs:
  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Rollback to previous deployment
        run: |
          echo "Critical workflow ${{ github.event.workflow }} failed - rolling back..."
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }} --yes
          echo "::notice::Automatically rolled back due to CI failure"
      
      - name: Notify rollback
        run: |
          echo "::error::Critical workflow ${{ github.event.workflow }} failed on main"
          echo "Deployment has been automatically rolled back"
          echo "Failed workflow: https://github.com/TomHart/lights-inventory/actions/runs/${{ github.event.workflow_run.id }}"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm build
      
      - name: Health check
        run: |
          echo "Waiting for Vercel deployment to be ready..."
          sleep 60
          curl -f https://lights-inventory.vercel.app/ || echo "Health check failed - Vercel may still be deploying"

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Rollback to previous deployment
        run: |
          echo "Rolling back to previous deployment..."
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }} --yes
          echo "::notice::Successfully rolled back to previous deployment"
      
      - name: Notify rollback
        run: |
          echo "::notice::Deployment failed and has been automatically rolled back"
          echo "Previous deployment restored"
          echo "Check: https://vercel.com/tomharts-projects/lights-inventory"
