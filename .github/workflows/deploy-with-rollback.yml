name: Deploy with Rollback

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI Pipeline", "Code Quality", "Convex Deploy"]
    types: [completed]

jobs:
  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    timeout-minutes: 15
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
            echo "Workflow failed - triggering rollback notification"
            echo "::error::Critical workflow ${{ github.event.workflow }} failed on main"
            echo "Please check: https://github.com/TomHart/lights-inventory/actions/runs/${{ github.event.workflow_run.id }}"
          else
            echo "Workflow succeeded"
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm build
      
      - name: Health check
        run: |
          echo "Waiting for Vercel deployment to be ready..."
          sleep 60
          curl -f https://lights-inventory.vercel.app/ || echo "Health check failed - Vercel may still be deploying"

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Notify rollback
        run: |
          echo "::error::Deployment failed, manual rollback required"
          echo "Visit https://vercel.com/tomharts-projects/lights-inventory to rollback"
