name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3bae4c131e765a5938b3e75a7dcda5b5c5f03617 # v3.26.13
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@3bae4c131e765a5938b3e75a7dcda5b5c5f03617 # v3.26.13

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3bae4c131e765a5938b3e75a7dcda5b5c5f03617 # v3.26.13
        with:
          category: "/language:${{matrix.language}}"
