name: Agent Approval Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-agent:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'devin-ai-integration[bot]' || github.event.pull_request.user.login == '158243242+devin-ai-integration[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check agent author
        run: |
          echo "PR authored by AI agent: ${{ github.event.pull_request.user.login }}"
          echo "::notice::This PR was created by an AI agent and requires manual review"
      
      - name: Add label for agent PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['agent-created']
            })
      
      - name: Require manual approval
        run: |
          echo "Agent-created PR requires manual review before merge"
          echo "Please review the changes carefully before approving"
