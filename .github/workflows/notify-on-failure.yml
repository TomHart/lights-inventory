name: Notify on Failure

on:
  workflow_run:
    workflows: ["Code Quality", "Convex Deploy", "Deploy with Rollback", "CodeQL"]
    types: [completed]
jobs:
  notify:
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send notification
        run: |
          echo "::error::Workflow ${{ github.event.workflow.name }} failed"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run URL: ${{ github.event.workflow_run.html_url }}"
