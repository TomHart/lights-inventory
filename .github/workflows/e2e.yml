name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# DISABLED: Preview server not starting reliably in CI
# TanStack Start's preview server doesn't start properly in GitHub Actions
# Multiple attempts with different approaches all failed:
# - Playwright webServer (timeout)
# - Background process with wait-on (timeout)
# - nohup with curl loop (never responds)
# TODO: Need to investigate TanStack Start preview server behavior in CI
# Alternative: Use dev server or simpler test setup
jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install --with-deps

      - run: pnpm build

      - name: Start preview server
        run: nohup pnpm preview > /tmp/preview.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
