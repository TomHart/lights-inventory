name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install --with-deps

      - name: Start dev servers (Convex + Vite)
        run: |
          mkdir -p logs
          nohup pnpm dev > logs/server.log 2>&1 &
          echo $! > logs/server.pid
        env:
          CI: true

      - name: Wait for servers
        run: |
          echo "Waiting for Vite server..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Vite server is ready"
              break
            fi
            echo "Waiting for Vite server... ($i/60)"
            sleep 2
          done
          echo "Waiting additional time for Convex initialization..."
          sleep 10
          echo "Server logs:"
          cat logs/server.log

      - run: pnpm test:e2e

      - name: Stop dev servers
        if: always()
        run: |
          if [ -f logs/server.pid ]; then
            kill $(cat logs/server.pid) || true
          fi
          pkill -f "pnpm dev" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
