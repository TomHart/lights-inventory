name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  smoke:
    name: Deployment smoke check
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
    steps:
      - name: Check deployed root, deep link, and assets
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.parse
          import urllib.request
          base = os.environ['DEPLOYMENT_URL'].rstrip('/')
          parsed = urllib.parse.urlparse(base)
          if parsed.scheme != 'https' or not (parsed.hostname == 'lights-inventory.vercel.app' or parsed.hostname.endswith('.vercel.app')):
              raise ValueError('Expected a Vercel HTTPS deployment URL')
          for path in ['/', '/properties']:
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  html = response.read().decode()
                  assert response.status == 200 and 'id="root"' in html
              assets = re.findall(r'(?:src|href)="(/assets/[^"\s]+)"', html)
              assert assets, 'No built assets found in HTML'
              for asset in assets:
                  with urllib.request.urlopen(base + asset, timeout=20) as response:
                      assert response.status == 200
                      assert 'text/html' not in response.headers.get('Content-Type', '')
          with urllib.request.urlopen(base + '/robots.txt', timeout=20) as response:
              assert response.status == 200 and b'User-agent:' in response.read()
          PY
