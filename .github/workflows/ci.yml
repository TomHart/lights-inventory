name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  smoke:
    name: Deployment smoke check
    if: github.event_name == 'deployment_status' && github.event.deployment.creator.login == 'vercel[bot]' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check deployed root, deep link, and assets
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.parse
          import urllib.request
          base = os.environ['DEPLOYMENT_URL'].rstrip('/')
          parsed = urllib.parse.urlparse(base)
          trusted = parsed.hostname == 'lights-inventory.vercel.app' or re.fullmatch(r'lights-inventory-[a-z0-9-]+-tomharts-projects\.vercel\.app', parsed.hostname or '')
          if parsed.scheme != 'https' or not trusted or parsed.port not in (None, 443) or parsed.username is not None or parsed.path or parsed.query or parsed.fragment:
              raise ValueError('Expected a trusted project HTTPS deployment origin')
          origin = (parsed.scheme, parsed.hostname, parsed.port or 443)
          class SameOriginRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  target = urllib.parse.urlparse(new_url)
                  if (target.scheme, target.hostname, target.port or 443) != origin or target.username is not None:
                      raise ValueError('Refusing a cross-origin redirect from the deployment')
                  return super().redirect_request(request, fp, code, message, headers, new_url)
          opener = urllib.request.build_opener(SameOriginRedirect())
          token = os.environ.get('VERCEL_AUTOMATION_BYPASS_SECRET')
          if token and (not token.isascii() or any(ord(character) < 32 or ord(character) == 127 for character in token)):
              raise ValueError('Invalid automation credential format')
          headers = {'x-vercel-protection-bypass': token} if token else {}
          def fetch(path):
              target = urllib.parse.urlparse(path)
              if target.scheme or target.netloc or not path.startswith('/') or path.startswith('//'):
                  raise ValueError('Expected a same-origin deployment path')
              return opener.open(urllib.request.Request(base + path, headers=headers), timeout=20)
          for path in ['/', '/properties']:
              with fetch(path) as response:
                  html = response.read().decode()
                  assert response.status == 200 and 'id="root"' in html
              assets = re.findall(r'(?:src|href)="(/assets/[^"\s]+)"', html)
              assert assets, 'No built assets found in HTML'
              for asset in assets:
                  with fetch(asset) as response:
                      assert response.status == 200
                      assert 'text/html' not in response.headers.get('Content-Type', '')
          with fetch('/robots.txt') as response:
              assert response.status == 200 and b'User-agent:' in response.read()
          PY
