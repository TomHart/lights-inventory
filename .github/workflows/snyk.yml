name: Snyk Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      # Snyk doesn't support pnpm workspaces well - skip for now
      - name: Skip Snyk (pnpm workspaces not supported)
        run: echo "Snyk security scan skipped - pnpm workspaces not supported by Snyk CLI"
