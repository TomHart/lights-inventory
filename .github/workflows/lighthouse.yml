name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Start dev servers (Convex + Vite)
        run: pnpm dev &
        env:
          CI: true

      - name: Wait for servers
        run: |
          echo "Waiting for Vite server..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Vite server is ready"
              break
            fi
            echo "Waiting for Vite server... ($i/60)"
            sleep 2
          done
          echo "Waiting additional time for Convex initialization..."
          sleep 10

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
