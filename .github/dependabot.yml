version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # No schedule - only run manually for security updates
    # Regular dependency updates are done manually
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    assignees:
      - "TomHart"
